title = "Project Hunter — gitleaks config"

# Extend the built-in ruleset (docs/SECURITY.md §5: "gitleaks em CI"); we
# only add allowlist entries and one custom rule, never remove or weaken a
# default rule.
[extend]
useDefault = true

# Narrow, value-based allowlist for specific, documented, fake credentials
# deliberately committed as CI/example fixtures — never real secrets.
# - The two Clerk dummy values (pk_test_.../sk_test_FAKE_CI_BUILD) appear
#   only in .github/workflows/ci.yml (Clerk's own documented example key
#   format, used so `pnpm build` can run in CI) — they are NOT in
#   .env.example, which leaves the Clerk variables empty.
# - sk-ant-FAKE... is a general prefix allowlist for any Anthropic-key-shaped
#   fake value following the "make it obviously fake" convention documented
#   in .claude/hooks/protect-secrets.mjs; it isn't tied to one occurrence.
[[allowlists]]
description = "Documented fake example secrets (not real credentials)"
regexes = [
  '''sk-ant-FAKE[A-Za-z0-9_-]*''',
  '''pk_test_Y2xlcmsuZXhhbXBsZS5jb20k''',
  '''sk_test_FAKE_CI_BUILD''',
  # Historical only: a test fixture committed before the FAKE convention
  # (commits 88c2dd7/4c107f7, packages/core/tests/unit/test_settings.py).
  # The working tree now uses "FAKEsupersecret"; this exact literal keeps
  # git-history scans clean without rewriting history.
  '''postgresql\+asyncpg://u:supersecret@host/db''',
]

# packages/core/tests/** fixtures use synthetic values. A path-only allowlist
# would exempt ANY value committed under that directory, including a real
# secret pasted in by mistake — gitleaks combines a single allowlist entry's
# `paths` and `regexes` with OR, not AND, so path and value can't be ANDed
# within one entry either. Require the line itself to say it's fake instead:
# a value-based boundary, not a path-based one, so a fixture is exempt only
# because of what it contains, wherever it happens to live.
[[allowlists]]
description = "Fixture values that self-declare as fake (must contain FAKE)"
regexTarget = "line"
regexes = [
  '''(?i)FAKE''',
]

# .env.example never holds real values — see docs/SECURITY.md §4 and §8; only
# variable names and illustrative placeholders are committed. Not anchored
# with "^": gitleaks path-matches against the path it walked with (which
# varies with --source / git vs. --no-git mode), so a plain substring is the
# portable choice — verified against both modes before landing this config.
[[allowlists]]
description = ".env.example placeholders"
paths = [
  '''\.env\.example$''',
]

# Database/cache connection URIs with an embedded password (e.g. a Neon or
# Redis Cloud connection string pasted into a config file) — the default
# ruleset has no rule shaped for this. `[^:\s/]+` is the username, `{8,}` is
# a real-looking password length (long enough that dev defaults like
# "hunter"/"redis" never match, so no allowlist is even needed for those).
[[rules]]
id = "hunter-db-uri-embedded-password"
description = "Database/cache URI with embedded password"
regex = '''(?i)(postgres(ql)?(\+asyncpg)?|redis|rediss)://[^:\s/]+:[^@\s]{8,}@'''
tags = ["database", "credentials"]

# Local/CI/dev-default hosts: docker-compose service names and localhost.
# Scoped to this rule only (not a global [[allowlists]] entry) so it can't
# weaken unrelated default rules that happen to mention "localhost".
[[rules.allowlists]]
description = "Local/dev/CI default hosts (docker-compose services, localhost)"
regexTarget = "line"
regexes = [
  '''@(localhost|127\.0\.0\.1|postgres|redis)(:|/)''',
]
