[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyjwt[crypto]>=2.9",
  "svix>=1.40",
  "posthog>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_api"]
