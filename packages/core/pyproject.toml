[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis[hiredis]>=5.2",
  "structlog>=24.4",
  "uuid6>=2024.7.10",
  "orjson>=3.10",
  "sentry-sdk>=2.19",
  "prometheus-client>=0.21",
  "starlette>=0.41",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_core"]
