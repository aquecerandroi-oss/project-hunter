[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The ledger (hunter_core.portfolio) *builds* the risk engine's own
  # ``PortfolioState``/``OpenPosition``/``PendingEntry`` instead of redefining
  # them (T3.3), so the distribution dependency points both ways: the pure
  # engine depends on the domain types here, and the ledger depends on the value
  # objects there. A distribution cycle is not a module-initialisation cycle -
  # ``hunter_risk`` only imports ``hunter_core.domain``/``strategies``, which
  # import nothing from ``hunter_core.portfolio``. Declared rather than hidden:
  # an undeclared import is a dependency no image build can catch (Astra, T3.3
  # policy review, answer 4).
  "hunter-risk",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis[hiredis]>=5.2",
  "structlog>=24.4",
  "uuid6>=2024.7.10",
  "orjson>=3.10",
  "sentry-sdk>=2.19",
  "prometheus-client>=0.21",
  "starlette>=0.41",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  # T4.8: Ed25519 signing for the meme wallet (hunter_core.execution.meme.signer).
  # Already in the lock transitively via pyjwt; declared so the signer never
  # depends on a dependency someone else may drop.
  "cryptography>=43",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_core"]
