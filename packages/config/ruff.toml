# PROJECT HUNTER — ruff gate (bloqueante). Filosofia: "error" só para o que é
# sempre bug ou sempre inseguro. Pressão de refatoração vive em ruff.strict.toml
# (não-bloqueante) até a contagem zerar; aí a regra migra para cá.
target-version = "py312"
line-length = 100
extend-exclude = ["infra/migrations/versions", "**/generated/**", ".venv", ".claude"]  # .claude/state holds ad-hoc profiling scripts, not product code

[lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade
  "B",           # bugbear — bugs reais (mutable defaults, except sem raise...)
  "ASYNC",       # async misuse (blocking calls em coroutines)
  "T20",         # print() proibido — usar structlog
  "S102", "S105", "S106", "S107", "S108", "S110", "S301", "S307", "S324", "S501", "S506", "S602", "S605", "S608",
                 # bandit: exec, senhas hardcoded, temp inseguro, pickle, eval, hash fraco, TLS desligado, yaml.load, shell=True, SQL concatenado
  "DTZ",         # datetime sem timezone — tudo é UTC aware
  "RUF100",      # noqa sem efeito
]
ignore = [
  "E501",        # comprimento de linha é do formatter
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "T20"]   # assert, credenciais fake e print em testes
"**/infra/scripts/**" = ["T20"]                    # scripts operacionais imprimem
"**/conftest.py" = ["S101"]

[lint.isort]
known-first-party = ["hunter_core", "hunter_exchanges", "hunter_indicators", "hunter_risk", "hunter_api",
  "hunter_market_worker", "hunter_scanner_worker", "hunter_strategy_worker", "hunter_execution_worker", "hunter_analytics_worker"]

[format]
quote-style = "double"
docstring-code-format = true
