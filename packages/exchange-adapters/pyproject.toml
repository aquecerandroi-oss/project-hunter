[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-exchanges"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  "httpx>=0.28",
  "websockets>=13",
  "msgpack>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_exchanges"]
