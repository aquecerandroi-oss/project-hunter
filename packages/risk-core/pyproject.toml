[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-risk"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  # The kill switch's day starts at midnight in America/Sao_Paulo (directive §5).
  # `zoneinfo` has no database of its own on Windows, where the dev box runs, and
  # `ZoneInfo("America/Sao_Paulo")` raises there without this. Pinning it also makes
  # the anchor identical on the VPS instead of depending on the host's tzdata.
  "tzdata>=2024.1",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_risk"]
