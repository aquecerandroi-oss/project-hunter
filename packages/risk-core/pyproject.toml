[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-risk"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  # The kill switch's day starts at midnight in America/Sao_Paulo (directive §5).
  # `zoneinfo` has no database of its own on Windows, where the dev box runs, and
  # `ZoneInfo("America/Sao_Paulo")` raises there without this. Pinning it also makes
  # the anchor identical on the VPS instead of depending on the host's tzdata.
  "tzdata>=2024.1",
]

[tool.hatch.build.targets.wheel]
# T4.14: ``hunter_risk_meme`` is the sibling engine of docs/RISK_ENGINE_MEME.md §13 —
# same distribution, separate package, never imported by ``hunter_risk`` (nor the
# reverse; ``tests/unit/meme/test_boundary.py`` proves it).
packages = ["hunter_risk", "hunter_risk_meme"]
