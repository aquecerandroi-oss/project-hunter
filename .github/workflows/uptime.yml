name: Uptime

# Alarme externo de "VPS fora do ar" (docs/DEPLOYMENT.md, "Alarme externo de disponibilidade").
# Repo publico -> minutos agendados gratis; nenhum segredo alem do GITHUB_TOKEN padrao.
# O que checa: infra/scripts/uptime_check.sh (site + api atras do Caddy; 3 tentativas, de ~1 a ~3,5 min).
# Falha -> o job fica vermelho (e-mail de run falha) e a issue unica "VPS fora do ar" e aberta/atualizada;
# recuperacao -> comentario e a issue e fechada.
#
# Silenciar em manutencao: variavel do repositorio UPTIME_PAUSED=true (o job e pulado), ou
# `gh workflow disable uptime.yml`. Lembrar de desfazer.

on:
  schedule:
    - cron: "3-59/10 * * * *" # minutos 3,13,23...; evita o inicio da hora, quando o agendador do GitHub mais atrasa
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Uma execucao por vez: evita duas corridas abrindo duas issues. Sem cancelar a que esta rodando.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    if: vars.UPTIME_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: VPS fora do ar
      ISSUE_LABEL: uptime-alarm
      # opcional: variavel UPTIME_BASE_URL do repositorio troca o alvo (ex.: dominio com Let's Encrypt)
      UPTIME_BASE_URL: ${{ vars.UPTIME_BASE_URL || 'https://169.58.116.99' }}
      # Borda atual = IP com certificado da CA interna do Caddy -> -k. Com dominio + Let's Encrypt,
      # a variavel UPTIME_CURL_TLS_ARGS do repositorio troca o padrao (ex.: --proto =https, sem -k).
      CURL_TLS_ARGS: ${{ vars.UPTIME_CURL_TLS_ARGS || '-k' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: infra/scripts/uptime_check.sh
          sparse-checkout-cone-mode: false

      # continue-on-error: a falha da sonda nao pode pular os passos da issue abaixo; o job
      # fica vermelho no ultimo passo. Se o checkout falhar (problema do GitHub), este passo
      # e pulado ("skipped") e nenhuma issue e aberta: nao e a VPS.
      - name: Checks (site + api)
        id: check
        continue-on-error: true
        env:
          UPTIME_REPORT: ${{ runner.temp }}/uptime-report.md
        run: bash infra/scripts/uptime_check.sh

      - name: Resumo
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        run: |
          {
            echo "### ${{ steps.check.outcome == 'success' && 'VPS ok' || 'VPS fora do ar' }}"
            cat "$RUNNER_TEMP/uptime-report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Issue "VPS fora do ar" (abrir/atualizar na falha, fechar na recuperacao)
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          now="$(date -u +'%Y-%m-%d %H:%M:%S')"
          # Identidade da issue = label exclusiva (so quem tem triagem aplica) + titulo, para nunca
          # editar/fechar uma issue homonima aberta por terceiros. `issue list` (nao `search`):
          # leitura consistente logo apos criar/fechar.
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "Aberta e fechada sozinha pelo workflow uptime.yml" 2>/dev/null || true
          existing="$(gh issue list --state open --label "$ISSUE_LABEL" --limit 100 --json number,title,createdAt \
            --jq "[.[] | select(.title == env.ISSUE_TITLE)] | sort_by(.createdAt) | .[0] // empty")"
          number="$(jq -r '.number // empty' <<<"$existing")"

          if [ "$CHECK_OUTCOME" = "failure" ]; then
            since="$now"
            [ -n "$number" ] && since="$(jq -r '.createdAt' <<<"$existing" | sed 's/T/ /; s/Z$//')"
            {
              echo "Alarme externo (GitHub Actions, a cada 10 min). Primeira falha detectada: **$since UTC**."
              echo
              echo "Ultima checagem com falha: **$now UTC** ([execucao]($run_url))."
              echo
              cat "$RUNNER_TEMP/uptime-report.md"
              echo
              echo "Esta issue e atualizada a cada execucao com falha e fechada sozinha quando as checagens voltam. Passo a passo em \`docs/DEPLOYMENT.md\` (Alarme externo de disponibilidade)."
            } > "$RUNNER_TEMP/issue-body.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/issue-body.md"
            else
              gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          elif [ -n "$number" ]; then
            since="$(jq -r '.createdAt' <<<"$existing" | sed 's/T/ /; s/Z$//')"
            gh issue comment "$number" --body "Recuperado em **$now UTC** ([execucao]($run_url)). Falha detectada desde **$since UTC**; a queda real pode ter comecado antes (o cron do GitHub nao tem hora garantida e cada checagem leva ate ~3,5 min de tentativas)."
            gh issue close "$number" --reason completed
          fi

      - name: Falhar o job se a sonda falhou
        if: ${{ !cancelled() && steps.check.outcome == 'failure' }}
        run: |
          echo "::error title=VPS fora do ar::$(tr '\n' ' ' < "$RUNNER_TEMP/uptime-report.md")"
          exit 1
