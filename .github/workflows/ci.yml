name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Python version comes from .python-version (uv reads it automatically via
# `uv python install`); Node version is pinned inline per actions/setup-node
# step (22, per docs/plans/M0.md prerequisites).

jobs:
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install Python (from .python-version)
        run: uv python install
      - name: Install dependencies (all workspace members)
        run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: file-size gate (350 lines)
        run: uv run python infra/scripts/check_file_size.py

  # Aspirational strict tier (packages/config/ruff.strict.toml). Never blocks
  # the gate; the violation count is written to the job summary so it's
  # visible without digging into logs. A rule graduates to ruff.toml (and
  # this job stops being interesting for it) only once its count hits zero —
  # see docs/WORKFLOW.md §6.
  python-lint-strict:
    name: python-lint-strict (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-packages
      - name: ruff check (strict config)
        run: |
          set +e
          output="$(uv run ruff check --config packages/config/ruff.strict.toml . --output-format=concise)"
          status=$?
          count=0
          if [ -n "$output" ]; then
            count=$(printf '%s\n' "$output" | wc -l)
          fi
          printf '%s\n' "$output"
          {
            echo "### ruff --config packages/config/ruff.strict.toml"
            echo "Violations: $count"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-packages
      # testcontainers spins up Postgres/Redis via the Docker daemon that
      # ubuntu-latest ships preinstalled; no service containers needed here.
      # `-m "unit or integration"` excludes the `live` marker by construction
      # (it hits real exchanges and must never run in CI).
      - name: pytest (unit + integration)
        run: uv run pytest -m "unit or integration" --cov --cov-report=xml
      # docs/plans/M1.md T1.7: already collected by the run above (testpaths
      # includes "tests" and "apps"; both are marked `integration`) -- this
      # extra, explicitly-named step exists only so a T1.7 regression shows up
      # as its own line in the CI log instead of buried in the full run.
      # `test_market_live.py` self-skips here (HUNTER_LIVE_TESTS unset):
      # CLAUDE.md's `live` marker is "never in CI" on purpose.
      - name: pytest (T1.7 market pipeline integration suite)
        run: uv run pytest tests/integration apps/api/tests/integration/test_t17_market_pipeline_contract.py -q

  # Runs unconditionally per CLAUDE.md/docs/plans/M0.md T10: this stays red
  # until T04 (Alembic setup) lands. That failure is expected, not a bug in
  # this job — do not skip it or make it non-blocking.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hunter
          POSTGRES_PASSWORD: hunter
          POSTGRES_DB: hunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hunter -d hunter"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_MIGRATIONS: postgresql://hunter:hunter@localhost:5432/hunter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-packages
      - name: alembic upgrade head
        run: uv run alembic -c infra/migrations/alembic.ini upgrade head
      - name: alembic check (no model/migration drift)
        run: uv run alembic -c infra/migrations/alembic.ini check
      - name: alembic downgrade -1
        run: uv run alembic -c infra/migrations/alembic.ini downgrade -1
      - name: alembic upgrade head (again)
        run: uv run alembic -c infra/migrations/alembic.ini upgrade head
      - name: partitions dry run
        run: uv run python infra/scripts/create_partitions.py --dry-run

  node:
    name: node
    runs-on: ubuntu-latest
    env:
      # Fake, publicly-documented dummy values (Clerk's own placeholder
      # format for CI/test builds: https://clerk.com/docs — never real
      # credentials, so they are plain env, not GitHub secrets. Allowlisted
      # in .gitleaks.toml.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_FAKE_CI_BUILD
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Guarded until T09 (packages/shared-types + the gen:types turbo task) is
  # in place. Once both exist, this regenerates the client types from the
  # running OpenAPI schema and fails on any uncommitted diff.
  types-drift:
    name: types-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gen:types and diff
        run: |
          set -e
          has_task=0
          if node -e "const p=require('./package.json'); process.exit((p.scripts && p.scripts['gen:types']) ? 0 : 1)"; then
            has_task=1
          fi
          has_pkg=0
          [ -f packages/shared-types/package.json ] && has_pkg=1
          if [ "$has_task" = "1" ] && [ "$has_pkg" = "1" ]; then
            pnpm gen:types
            git diff --exit-code packages/shared-types
          else
            echo "gen:types not available yet (T09)"
          fi

  # docs/plans/M0.md T12. Always runs (never job-level-skipped: `gate` below
  # treats any `skipped` need as a failure, same reasoning as docker-build's
  # step-level guards) — public.spec.ts and api-health.spec.ts need no Clerk
  # keys at all, and signup-onboarding.spec.ts self-skips with its own
  # reason when CLERK_E2E_PUBLISHABLE_KEY/CLERK_E2E_SECRET_KEY aren't set.
  # Those two are real Clerk dev-instance keys (test mode on), distinct from
  # the fake NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY/CLERK_SECRET_KEY used to build
  # the `web` image when no secrets are configured.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [node, python-test]
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_E2E_SECRET_KEY || 'sk_test_FAKE_CI_BUILD' }}
      CLERK_E2E_PUBLISHABLE_KEY: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY }}
      CLERK_E2E_SECRET_KEY: ${{ secrets.CLERK_E2E_SECRET_KEY }}
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clerk E2E keys status
        run: |
          if [ -n "$CLERK_E2E_PUBLISHABLE_KEY" ] && [ -n "$CLERK_E2E_SECRET_KEY" ]; then
            echo "CLERK_E2E_* secrets present -- signup-onboarding.spec.ts will run against a real Clerk dev instance"
          else
            echo "CLERK_E2E_* secrets not configured -- signup-onboarding.spec.ts will self-skip (public + api-health specs still run)"
          fi
      - name: docker compose up (postgres, redis, api, worker, web)
        run: docker compose -f infra/docker/docker-compose.yml up -d --build
      - name: wait for apps/api /ready
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/ready > /dev/null; then
              echo "apps/api ready"
              exit 0
            fi
            sleep 2
          done
          echo "apps/api never became ready" >&2
          docker compose -f infra/docker/docker-compose.yml logs api migrate
          exit 1
      - name: install chromium
        run: pnpm --filter @hunter/e2e install-browsers
      - name: run e2e suite
        run: pnpm --filter @hunter/e2e e2e
      # docs/plans/M1.md T1.7: already run above (part of the full suite) --
      # named separately so markets.spec.ts's own result (and, when
      # CLERK_E2E_* secrets are absent, its self-skip) is visible as its own
      # CI log line, same reasoning as python-test's T1.7 step above.
      - name: run T1.7 markets.spec.ts explicitly
        run: pnpm --filter @hunter/e2e exec playwright test markets.spec.ts
      - name: upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts
          retention-days: 7
      - name: docker compose down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # If this repo is ever moved under a GitHub organization,
      # gitleaks/gitleaks-action requires a GITLEAKS_LICENSE secret (free for
      # open source; https://gitleaks.io/products.html) — the action fails
      # without one on org-owned repos. Not needed for a personal-account repo.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-packages
      # `--strict` (asked for in docs/plans/M0.md T10) fails the whole audit
      # if ANY dependency can't be collected — and in a uv workspace every
      # local hunter_* member is "not found on PyPI", so --strict fails
      # unconditionally here regardless of real vulnerabilities. --skip-editable
      # keeps the strict *intent* (fail hard on anything pip-audit can
      # actually check) without that permanent false failure. Verified
      # locally: `uv run pip-audit --strict` → fails on hunter-analytics-worker
      # even with zero real CVEs; `uv run pip-audit --skip-editable` → passes
      # and still audits every third-party dependency.
      - name: pip-audit
        run: uv run pip-audit --skip-editable
      - name: bandit
        run: uv run bandit -r packages apps services -q -ll
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  forbidden-patterns:
    name: forbidden-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash infra/scripts/forbidden_patterns.sh

  # Guarded until T07 (infra/docker/**) lands. Job-level `if` can't call
  # hashFiles() (actionlint: only steps.if/env/... contexts allow it), so the
  # guard lives on each step instead and the job itself always runs.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: hashFiles('infra/docker/Dockerfile.api-workers', 'infra/docker/Dockerfile.web') != ''
      - name: build api-workers image
        if: hashFiles('infra/docker/Dockerfile.api-workers') != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.api-workers
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web image
        if: hashFiles('infra/docker/Dockerfile.web') != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: no Dockerfiles yet (T07)
        if: hashFiles('infra/docker/Dockerfile.api-workers', 'infra/docker/Dockerfile.web') == ''
        run: echo "infra/docker/Dockerfile.* not present yet (T07); nothing to build."

  # Required status check. Green only once every blocking job above is
  # green; python-lint-strict is intentionally excluded (non-blocking).
  # `if: always()` makes this the standard "gate" pattern: it still runs (and
  # can report failure) even if an upstream job failed or was cancelled,
  # instead of GitHub skipping it because a `needs` job didn't succeed.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-lint
      - python-test
      - migrations
      - node
      - types-drift
      - security
      - forbidden-patterns
      - docker-build
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed (or were guarded off before their prerequisite task landed)."
