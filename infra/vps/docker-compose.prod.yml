# PROJECT HUNTER - override de producao 24/7 numa VPS (docs/DEPLOYMENT.md,
# secao "VPS (Contabo) - operacao 24/7"). Nao se usa sozinho:
#
#   docker compose --env-file .env -p hunter \
#     -f infra/docker/docker-compose.yml -f infra/vps/docker-compose.prod.yml up -d --build
#
# (ou, mais simples, `bash infra/vps/compose.sh up`)
#
# O que este arquivo muda em relacao ao compose de dev:
#   - restart: always em tudo que precisa sobreviver a reboot;
#   - nenhuma porta em 0.0.0.0 alem das do Caddy: api e web so em 127.0.0.1
#     (tunel SSH para depurar), postgres e redis em porta nenhuma;
#   - Caddy na frente, TLS automatico quando ha dominio;
#   - HUNTER_ENV=staging (nao production): staging ja liga logs JSON, headers
#     de seguranca e a exigencia de todos os segredos do Clerk, sem prometer
#     as garantias de production, que ainda nao existem (Fase 4);
#   - senha real no Postgres, vinda do .env;
#   - logs com rotacao, para um worker 24/7 nao encher o disco.
#
# `--env-file .env` nao e opcional: o diretorio de projeto do compose e o do
# PRIMEIRO arquivo -f (infra/docker/), entao o .env da raiz nao seria lido
# para interpolar ${POSTGRES_PASSWORD} e companhia.

x-prod-logging: &prod-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-prod-db-env: &prod-db-env
  DATABASE_URL: postgresql+asyncpg://hunter:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (infra/scripts/setup_env.sh --vps)}@postgres:5432/hunter
  REDIS_URL: redis://redis:6379/0
  HUNTER_ENV: staging

# T3.15d (.claude/state/review-T3.15-security.md HIGH 1, astra-review-lab-pronto-2026-09-08.md
# §2): DATABASE_URL_MIGRATIONS is the schema owner's DSN — the connection
# `activate_strategy_version.py`/`derive_variant.py`/`seed.py`/
# `open_paper_wallet.py` write through. It used to live inside x-prod-db-env
# above, so `api` and every worker inherited it: an RCE in any one of them
# (dependency CVE, path traversal reading /proc/self/environ, an error
# handler dumping env) could open a connection as the table owner and write
# `strategy_versions.purpose='paper'`, activate a version outright, or
# disable RLS on any tenant table. Split into its own anchor, granted only to
# `migrate` and the `ops` profile service below — no long-running process
# ever sees it (docs/DATABASE.md §23, docs/DEPLOYMENT.md §3.4).
x-prod-owner-env: &prod-owner-env
  DATABASE_URL_MIGRATIONS: postgresql+asyncpg://hunter:${POSTGRES_PASSWORD}@postgres:5432/hunter

services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    logging: *prod-logging

  redis:
    restart: always
    # Persistencia: AOF everysec. O hot state e reconstruivel (docs/DEPLOYMENT.md
    # secao 6), mas um restart limpo custa um ciclo inteiro de reconexao de
    # streams; o AOF encurta isso de minutos para segundos.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    logging: *prod-logging

  migrate:
    environment:
      <<: [*prod-db-env, *prod-owner-env]
      HUNTER_COMMAND: migrate
    logging: *prod-logging

  # T3.15d — profile-only shell carrying x-prod-owner-env, so the ops scripts
  # that used to run via `docker exec hunter-api-1 python infra/scripts/...`
  # (docs/ACTIVATION.md) get the owner DSN from an audited, short-lived
  # container instead of the long-lived `api` container, which no longer
  # carries DATABASE_URL_MIGRATIONS at all. `image`/`build`/`profiles: ["ops"]`/
  # `entrypoint: []`/`command: ["true"]`/`cap_drop: [NET_RAW, NET_ADMIN]` (LOW-G,
  # same rationale as the workers below — docs/SECURITY.md §5) all come from
  # the `ops` service this block merges into
  # (`infra/docker/docker-compose.yml`, not repeated here): the profile keeps
  # it out of every bare `docker compose up`/`compose.sh up|update`; it exists
  # to be `run --rm`, never `up`d. Naming it explicitly (`docker compose up
  # ops`) bypasses the profile gate, so `entrypoint: []` + the no-op `command`
  # mean that even then it just runs `true` and exits — it never becomes a
  # resident process holding the owner connection open.
  ops:
    environment:
      <<: [*prod-db-env, *prod-owner-env]
    # T3.15e: fixed a wrong claim here — `ops` DOES have a counterpart in the
    # base compose (`infra/docker/docker-compose.yml` declares its own `ops`
    # service, `build:` included since that same task), and this file's block
    # merges into it by service name, exactly like `api`/`migrate`/every
    # worker above. The `env_file` entry below is redundant with the one the
    # base file already declares (Compose concatenates the list across `-f`
    # files) and is repeated here only so this block stays self-explanatory
    # on its own: Settings()'s `_require_settings_in_prod`
    # (packages/core/hunter_core/settings.py) runs on every construction and,
    # under HUNTER_ENV=staging (from x-prod-db-env), requires the CLERK_*
    # secrets too; those live in the VPS `.env`, not in this compose file.
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    logging: *prod-logging

  api:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: api
      # O peer TCP da api e o Caddy, nao o loopback: sem este IP o uvicorn
      # ignora X-Forwarded-For e todo request vira "o mesmo cliente" para o
      # rate limit por endereco (um visitante abusivo derruba o limite de
      # todos). IP fixo definido na rede `default` abaixo.
      FORWARDED_ALLOW_IPS: 172.28.0.10
      # T3.28a — web's SSR fetches to this api go straight over the compose
      # network (API_URL below), never through Caddy, so they all arrive
      # from web's own fixed address, not Caddy's — an address that must
      # NOT be added to FORWARDED_ALLOW_IPS (web does not forward the
      # browser's real address on that call today) but that would otherwise
      # share RATE_LIMIT_PER_MINUTE across the whole site's server-rendered
      # traffic. Must match web's `networks.default.ipv4_address` below.
      INTERNAL_PEER_IPS: 172.28.0.11
      WEB_ORIGIN: ${HUNTER_PUBLIC_URL:?defina HUNTER_PUBLIC_URL no .env}
      # CORS_ALLOWED_ORIGINS fica de fora de proposito: ApiSettings declara
      # list[str] e o pydantic-settings tenta json.loads no valor antes do
      # validador que aceita "a,b", entao uma URL simples derruba a api no
      # boot (SettingsError, container em restart loop, Caddy sem upstream
      # saudavel). Sem a variavel, _default_cors_from_web_origin usa
      # WEB_ORIGIN - o mesmo valor que queriamos.
      API_URL: ${HUNTER_PUBLIC_URL}
      NEXT_PUBLIC_API_URL: ${HUNTER_PUBLIC_URL}
      NEXT_PUBLIC_WS_URL: ${HUNTER_WS_URL:?defina HUNTER_WS_URL no .env}
    # !override: sem isso o compose CONCATENA as listas de ports e a 8000
    # publica de dev continuaria valendo em 0.0.0.0 (e portas publicadas pelo
    # Docker furam o ufw).
    ports: !override
      - "127.0.0.1:8000:8000"
    logging: *prod-logging

  market-worker:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
    logging: *prod-logging

  # T2.5g - os outros tres shards do coletor (perfil `shards` do compose base).
  # Com 200 mercados num processo so, a VPS mediu CPU 101%, 1,2M eventos
  # descartados e `covered_until` congelado em `session_since` desde o boot: a
  # fila do adapter nunca alcanca o corte de 0,5 s, entao o coletor (com razao)
  # nao prova continuidade nenhuma. Quatro processos x ~50 mercados cabem nos
  # 12 vCPU e cada um escreve o proprio `hb:market:binance:{i}of4`, que a API
  # agrega. Subir com:
  #
  #   MARKET_SHARDS=4 bash infra/vps/compose.sh update
  #
  # (`compose.sh update` ja exporta GIT_SHA e, com MARKET_SHARDS>1, ja adiciona
  # `--profile shards` sozinho - ver infra/vps/README.md.) NAO rode `docker
  # compose ... up` a mao sem `export GIT_SHA=$(git rev-parse --short HEAD)`
  # antes: sem o SHA o compose cai no default `hunter-api:dev`, uma imagem
  # velha, e o `migrate` falha com "Can't locate revision" numa migracao que a
  # imagem dev nao conhece - foi exatamente isso, mais a colisao de IP do
  # Caddy acima, que tirou o site do ar em 2026-09-07.
  #
  # `MARKET_SHARDS` mora no ambiente do comando (ou no .env, que os agentes nao
  # escrevem); sem ele os tres extras recusam `1/1` no boot em vez de duplicar
  # a coleta em silencio. Ao mudar N ficam grupos de consumidor orfaos do
  # backfill (`market-worker.backfill.binance.{i}of{N}`, PIPELINE.md 1b item 2):
  # removidos a mao, depois de conferir que nao ha pendencia neles.
  market-worker-1:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
    logging: *prod-logging

  market-worker-2:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
    logging: *prod-logging

  market-worker-3:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
    logging: *prod-logging

  # T3.0f - coletor SPOT dedicado (perfil `spot` do compose base). Nunca no
  # `.env`: MARKET_ROLE e MARKET_SPOT_ENABLED ficam explicitos AQUI, no
  # servico, para que um revisor os veja sem grepar o .env e para que a flag
  # nunca alcance por acidente um dos shards perpetuos acima (foi exatamente
  # essa combinacao - spot no mesmo event loop de um shard perpetuo carregado
  # - que a T3.0c mediu quebrando o keepalive do socket perpetuo). Subir com:
  #
  #   MARKET_SPOT=1 MARKET_SHARDS=4 bash infra/vps/compose.sh update
  #
  # Verificar depois: `hb:market:spot:binance` vivo (SCAN no Redis, ou
  # `/api/v1/system/workers` - aparece como role `market-spot`, nunca como um
  # shard perpetuo faltando), `docker logs market-worker-spot`, e que os
  # heartbeats perpetuos (`hb:market:binance:{i}of4`) continuam com
  # `reconnects` parado e `last_event_at` fresco.
  market-worker-spot:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_ROLE: spot
      MARKET_SPOT_ENABLED: "true"
      MARKET_SHARD: "0/1"
    logging: *prod-logging

  # Shadow Lab (docs/plans/SHADOW-LAB.md, S2). Sem este bloco o servico existe
  # no compose base mas herda o `x-api-env` de desenvolvimento, entao na VPS ele
  # sobe com a senha de dev e morre em loop com
  # `asyncpg.exceptions.InvalidPasswordError: password authentication failed for
  # user "hunter"` — medido em 2026-09-06, na primeira subida do Lab na VPS.
  # Cada servico que fala com o Postgres precisa do `*prod-db-env` aqui; nao ha
  # heranca automatica entre os dois arquivos para chaves que o override nao
  # menciona.
  strategy-worker:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: strategy
      HEALTH_PORT: "8001"
    logging: *prod-logging

  # M2 scanner (T2.5). Mesma regra acima: sem `*prod-db-env` ele sobe com a
  # senha de dev e reinicia em loop (medido em 2026-09-06 no deploy fa9f957).
  scanner-worker:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: scanner
      HEALTH_PORT: "8001"
    logging: *prod-logging

  # M3 execution (T3.5). Sem `*prod-db-env` ele sobe com a senha de dev e
  # reinicia em loop (mesma medicao de 2026-09-06). `ENABLE_LIVE_TRADING: "false"`
  # e explicito: o processo recusa subir se for true, e um paper worker que
  # subisse mesmo assim seria um que o operador acredita estar operando de
  # verdade. Nenhuma ativacao de producao nesta tarefa (T3.13).
  execution-worker:
    restart: always
    environment:
      <<: *prod-db-env
      HUNTER_ROLE: execution
      HEALTH_PORT: "8001"
      ENABLE_LIVE_TRADING: "false"
      ENABLE_PAPER_AUTONOMY: ${ENABLE_PAPER_AUTONOMY:-false}
    logging: *prod-logging

  web:
    restart: always
    build:
      args:
        # NEXT_PUBLIC_* entram no bundle em build time: mudar o dominio exige
        # `up -d --build`, nao so restart.
        NEXT_PUBLIC_API_URL: ${HUNTER_PUBLIC_URL}
        NEXT_PUBLIC_WS_URL: ${HUNTER_WS_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?defina no .env}
    environment:
      HUNTER_ENV: staging
      API_URL: http://api:8000          # SSR fala com a api pela rede interna
      NEXT_PUBLIC_API_URL: ${HUNTER_PUBLIC_URL}
      NEXT_PUBLIC_WS_URL: ${HUNTER_WS_URL}
      WEB_ORIGIN: ${HUNTER_PUBLIC_URL}
    ports: !override
      - "127.0.0.1:3000:3000"
    # T3.28a — fixed address so the api's INTERNAL_PEER_IPS (above) can name
    # it; same ip_range reasoning as Caddy's .10 pin (README.md / the
    # `networks` block at the bottom of this file), one address away so
    # the two static pins never collide.
    networks:
      default:
        ipv4_address: 172.28.0.11
    logging: *prod-logging

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "${HUNTER_HTTP_PORT:-80}:80"
      - "${HUNTER_HTTPS_PORT:-443}:443"
      - "${HUNTER_HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      HUNTER_SITE_ADDRESS: ${HUNTER_SITE_ADDRESS:?defina HUNTER_SITE_ADDRESS no .env (dominio, ou :80 sem dominio)}
      # Caddy's {$VAR:default} only falls back when the variable is UNSET; an empty
      # string (no-domain setup) would reach `email` and break the Caddyfile parse.
      HUNTER_ACME_EMAIL: ${HUNTER_ACME_EMAIL:-hunter@example.invalid}
      # `internal` (IP sem dominio) ou o e-mail do ACME (dominio) - ver Caddyfile.
      HUNTER_TLS_ARG: ${HUNTER_TLS_ARG:-internal}
      # Nome usado quando o cliente nao manda SNI (IP puro). compose.sh exporta.
      HUNTER_DEFAULT_SNI: ${HUNTER_DEFAULT_SNI:-localhost}
    volumes:
      - ../vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados: perder isto e refazer ACME do zero
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.10
    logging: *prod-logging

networks:
  default:
    # Sub-rede fixa so para o Caddy ter IP estavel (FORWARDED_ALLOW_IPS acima).
    # Se 172.28.0.0/24 colidir com algo na VPS, troque aqui e no
    # FORWARDED_ALLOW_IPS da api - os dois tem que andar juntos.
    #
    # `ip_range` restringe so a alocacao DINAMICA do Docker (o que qualquer
    # container sem `ipv4_address` recebe) a 172.28.0.128-255; enderecos
    # estaticos como o .10 do Caddy continuam validos fora do ip_range, desde
    # que dentro do subnet (comportamento documentado do IPAM do Docker).
    # Sem isto, o alocador dinamico distribui a partir do menor IP livre
    # (normalmente .2 em diante) e um container comum pode roubar o .10 antes
    # do Caddy subir de novo - foi o que aconteceu em 2026-09-07: o perfil
    # `shards` recriou containers, o scanner-worker recebeu .10 primeiro e o
    # Caddy morreu com "failed to set up container networking: Address
    # already in use" (site fora ate recriar o scanner). infra/vps/README.md
    # tem o detalhe da escolha.
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25

volumes:
  caddy_data:
  caddy_config:
