# PROJECT HUNTER — local dev stack (docs/DEPLOYMENT.md §3).
#
#   docker compose -f infra/docker/docker-compose.yml up -d --build
#
# Works with zero `.env` file (dev defaults below); an `.env` at the repo
# root (copy of .env.example, never committed) overrides them — e.g. real
# Clerk keys so sign-in actually works. Volumes only for the databases —
# every other service is stateless and rebuilt from source/image each run.
#
# `market-worker` runs continuously with HUNTER_ROLE=market.
# Run one HUNTER_ROLE per container (M1).

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://hunter:hunter@postgres:5432/hunter
  DATABASE_URL_MIGRATIONS: postgresql+asyncpg://hunter:hunter@postgres:5432/hunter
  REDIS_URL: redis://redis:6379/0
  HUNTER_ENV: development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: hunter
      POSTGRES_DB: hunter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d hunter"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hunter_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hunter_redis:/data

  migrate:
    # No `build:` here on purpose — the `api` service below builds
    # hunter-api:${GIT_SHA:-dev} once; migrate/worker just reuse that tag so
    # `docker compose up --build` doesn't build the same image three times.
    image: hunter-api:${GIT_SHA:-dev}
    environment:
      <<: *api-env
      # NOT HUNTER_ROLE: "migrate" isn't a valid hunter_core.settings.Role —
      # see infra/docker/entrypoint.sh's comment. HUNTER_COMMAND is the
      # image-only switch entrypoint.sh checks first; HUNTER_ROLE stays at
      # its image default ("api", a real Settings literal) so alembic's
      # env.py (which constructs the full Settings()) doesn't fail validation.
      HUNTER_COMMAND: migrate
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-workers
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: hunter-api:${GIT_SHA:-dev}
    environment:
      <<: *api-env
      HUNTER_ROLE: api
      WEB_ORIGIN: http://localhost:3000
      # T3.28a — the web container's own SSR fetches to this api all arrive
      # from one TCP peer (web's fixed address below), which is not in
      # FORWARDED_ALLOW_IPS and never should be (web does not forward the
      # browser's real address on that call). Without this, that one address
      # shares RATE_LIMIT_PER_MINUTE (120/min) across the whole site's
      # server-rendered traffic — see the design-audit measurement in
      # .claude/state/notes-T3.28a.md and the trust-chain docstring in
      # hunter_api/middleware/rate_limit.py. The IP has to match web's
      # `networks.default.ipv4_address` below.
      INTERNAL_PEER_IPS: 172.29.0.10
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-worker:
    image: hunter-api:${GIT_SHA:-dev}
    # security-reviewer, T3.28a finding 3 (T3.28d): no worker calls a raw
    # socket, pings, or otherwise touches the network stack below TCP/UDP --
    # dropping these closes the one thing a compromised worker container
    # could otherwise do that a stolen application credential alone can't:
    # forge/sniff link-layer traffic (e.g. ARP-spoof the fixed .10/.11
    # addresses `web`/Caddy use for INTERNAL_PEER_IPS/FORWARDED_ALLOW_IPS)
    # to redirect another container's traffic through itself. See
    # docs/SECURITY.md §5.
    cap_drop: [NET_RAW, NET_ADMIN]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      # T2.5g: shard 0 of ``MARKET_SHARDS`` (default 1 = the whole universe in
      # one process, exactly as before). ``MARKET_SHARDS=4 docker compose
      # --profile shards up -d`` starts this one as 0/4 plus the three
      # services below. Forgetting the variable does not silently double the
      # collection: the extra shards would be ``1/1``, which
      # ``_parse_market_shard`` refuses at startup (visible crash loop).
      MARKET_SHARD: 0/${MARKET_SHARDS:-1}
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Budgets measured in the T1.6 operational proof (.claude/state/t16-proof.md
    # §10), not guessed. The health server shares the worker's single event
    # loop with ingestion, so under a full 200-market load plus a gap-recovery
    # backlog its own /ready latency was measured swinging between 0.01s and
    # 24.79s. The previous 2s client timeout / 3s healthcheck timeout produced
    # runs of four consecutive false failures on a worker that was in fact
    # ready — a false "unhealthy" is worse than none, because anything acting
    # on it (autoheal, an orchestrator probe, a load balancer) would restart or
    # evict a healthy worker. These values absorb the measured tail; the real
    # fix is the ingestion capacity work (HIGH-1, M2), not a bigger timeout.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8001/ready', timeout=25); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 15s
      timeout: 30s
      start_period: 60s
      retries: 5

  # T2.5g — the other three shards, behind the `shards` profile so a plain
  # `up` still runs one collector. Explicit services, not `deploy.replicas`:
  # compose does not expose a replica's index, and each shard needs its own
  # MARKET_SHARD, its own heartbeat key and its own health port mapping. Start
  # them with:
  #
  #   MARKET_SHARDS=4 docker compose -f infra/docker/docker-compose.yml \
  #     --profile shards up -d
  #
  # Universe leadership is a Redis lock (universe_leader.py), so start order
  # does not matter and no shard's readiness depends on its siblings.
  market-worker-1:
    extends:
      service: market-worker
    profiles: [shards]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 1/${MARKET_SHARDS:-1}

  market-worker-2:
    extends:
      service: market-worker
    profiles: [shards]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 2/${MARKET_SHARDS:-1}

  market-worker-3:
    extends:
      service: market-worker
    profiles: [shards]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 3/${MARKET_SHARDS:-1}

  # T3.0f — o coletor SPOT como processo dedicado, nunca um modo de um shard
  # perpétuo. `MARKET_SPOT_ENABLED` ligado *aqui*, no serviço, nunca em `.env`:
  # a T3.0c/t30-proof.md mediu que ligar o spot dentro do MESMO event loop de
  # um shard perpétuo carregado faz o socket perpétuo perder o keepalive
  # (código 1011, 8 reconnects em 6 min, 0 velas persistidas) — este serviço
  # existe para que `MARKET_SPOT_ENABLED=true` nunca alcance um shard
  # perpétuo, mesmo que a variável exista em algum ambiente compartilhado.
  # `MARKET_ROLE=spot` (T3.0f, hunter_core.settings.Settings): nenhuma tarefa
  # perpétua roda neste processo — sem universo, sem ingest, sem heartbeat,
  # sem backfill perpétuo. `MARKET_SHARD=0/1` explícito: o coletor spot é um
  # processo solo dono do universo spot inteiro, nunca um shard (um
  # `MARKET_ROLE=spot` com `MARKET_SHARD` fatiado é recusado no boot).
  #
  #   docker compose -f infra/docker/docker-compose.yml --profile spot up -d
  #
  # Healthcheck herdado do `market-worker` base: `/ready` deste processo tem
  # `spot` como *status detail* (nunca um check — connected/degraded/absent),
  # então um socket spot reconectando não derruba o container.
  market-worker-spot:
    extends:
      service: market-worker
    profiles: [spot]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_ROLE: spot
      MARKET_SPOT_ENABLED: "true"
      MARKET_SHARD: "0/1"

  # Perfil `shards8`: os shards 4..7, para uma topologia de 8 x ~25 mercados.
  # Medido na T2.5g: com 4 x 50 o coletor ainda descarta eventos e publica o
  # tick com 4,3 s (p50); a fatia por `crc32 % N` também é desbalanceada (53 a
  # 58 mercados por shard, e o tráfego mais ainda). Só faz sentido onde há
  # core sobrando — 8 processos de coleta na VPS de 12 vCPU deixam pouco para
  # scanner/strategy/api.
  #
  #   MARKET_SHARDS=8 docker compose -f infra/docker/docker-compose.yml \
  #     --profile shards --profile shards8 up -d
  market-worker-4:
    extends:
      service: market-worker
    profiles: [shards8]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 4/${MARKET_SHARDS:-1}

  market-worker-5:
    extends:
      service: market-worker
    profiles: [shards8]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 5/${MARKET_SHARDS:-1}

  market-worker-6:
    extends:
      service: market-worker
    profiles: [shards8]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 6/${MARKET_SHARDS:-1}

  market-worker-7:
    extends:
      service: market-worker
    profiles: [shards8]
    environment:
      <<: *api-env
      HUNTER_ROLE: market
      HEALTH_PORT: "8001"
      MARKET_SHARD: 7/${MARKET_SHARDS:-1}

  # Market intelligence (docs/plans/M2.md, task T2.5). Consumes the market.*
  # streams, evaluates every monitored market against the engines of
  # hunter_indicators and persists what it concluded: feature_snapshots,
  # anomalies, market_regimes, opportunities (+ history) and feature_baselines.
  # It places no orders and never calls an exchange: missing history is asked of
  # the market-worker over `market.backfill.requested`, which owns REST.
  scanner-worker:
    image: hunter-api:${GIT_SHA:-dev}
    # security-reviewer, T3.28a finding 3 (T3.28d) -- see market-worker above.
    cap_drop: [NET_RAW, NET_ADMIN]
    environment:
      <<: *api-env
      HUNTER_ROLE: scanner
      HEALTH_PORT: "8001"
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `service_started`, not `service_healthy`: the scanner reads the hot state
      # and the durable candles the collector writes, but it has to survive the
      # collector being down (it evaluates what it has and says the tape is
      # uncovered, rather than dying), and a hard dependency would turn one
      # restart into two.
      market-worker:
        condition: service_started
    restart: unless-stopped
    # Four readiness checks (hunter_scanner_worker/health.py): `scanner_consumers`
    # (every stream loop iterated recently -- a quiet stream is not a stuck
    # consumer), `scanner_evaluation` (the cycle is running: consumers that mark
    # work nobody performs would otherwise look perfectly healthy),
    # `scanner_outbox` (nothing queued and unpublished for too long) and
    # `scanner_baselines` (the archive was *loaded* -- deliberately not "is
    # mature", because a fresh install has no seven-day history and saying so is
    # the honest state). Timeouts mirror the market-worker's, for the same
    # measured reason: the health server shares the worker's event loop, so its
    # /ready latency follows the loop's load, and a false "unhealthy" would
    # restart a worker mid-cycle.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8001/ready', timeout=25); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 15s
      timeout: 30s
      start_period: 90s
      retries: 5

  # Shadow Lab (docs/plans/SHADOW-LAB.md, task S2). Evaluates the activated
  # strategy_versions on their own timeframe closes, persists each decision with
  # its immutable envelope and follows the hypothetical outcome bar by bar.
  # It places no orders and touches no portfolio: every signal it writes carries
  # purpose = research_only and travels on its own `shadow.signals.emitted`
  # stream. Same image as api/market-worker; HUNTER_ROLE=strategy is what
  # entrypoint.sh dispatches on.
  strategy-worker:
    image: hunter-api:${GIT_SHA:-dev}
    # security-reviewer, T3.28a finding 3 (T3.28d) -- see market-worker above.
    cap_drop: [NET_RAW, NET_ADMIN]
    environment:
      <<: *api-env
      HUNTER_ROLE: strategy
      HEALTH_PORT: "8001"
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # not `service_healthy`: the shadow worker reads the same durable candles
      # and the same hot state the market-worker writes, but it must survive the
      # collector being down (it backs off and censors, it does not die), and a
      # hard dependency would make one restart cascade into two.
      market-worker:
        condition: service_started
    restart: unless-stopped
    # The four readiness checks are `shadow_migration`, `shadow_versions` (red when
    # active versions exist but none is runnable), `shadow_consumer` and `shadow_outbox`
    # (hunter_strategy_worker/health.py). The timeouts mirror the
    # market-worker's, for the same measured reason: the health server shares the
    # worker's event loop, so its /ready latency follows the loop's load. A false
    # "unhealthy" would restart a worker that is mid-decision.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8001/ready', timeout=25); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 15s
      timeout: 30s
      start_period: 60s
      retries: 5

  # M3 execution (T3.5). Runs as the engine (`hunter_worker`): the wallet lock,
  # `fifo_v1`, `portfolios.kill_switch_state`, the equity curve and the outbox are
  # worker-only since `0007_paper_roles` (§19.1). `ENABLE_LIVE_TRADING` is passed
  # explicitly and pinned to false: the process refuses to start if it is true.
  execution-worker:
    image: hunter-api:${GIT_SHA:-dev}
    # security-reviewer, T3.28a finding 3 (T3.28d) -- see market-worker above.
    cap_drop: [NET_RAW, NET_ADMIN]
    environment:
      <<: *api-env
      HUNTER_ROLE: execution
      HEALTH_PORT: "8001"
      ENABLE_LIVE_TRADING: "false"
      ENABLE_PAPER_AUTONOMY: ${ENABLE_PAPER_AUTONOMY:-false}
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `service_started`, not `service_healthy`: the wallet reads the spot hot
      # state the collector writes, and it has to survive the collector being
      # down — with no usable book a protection stays pending **with an alert**
      # instead of fabricating a fill, which is the behaviour the contract asks
      # for and which a hard dependency would replace with a restart loop.
      market-worker:
        condition: service_started
    restart: unless-stopped
    # Five readiness checks (hunter_execution_worker/health.py): `paper_schema`
    # (0006/0007 applied), `kill_switch_legible` (this process can still read the
    # latch it obeys), `mtm_fresh` (the curve that anchors the day is not frozen,
    # <= 120 s), `protection_prompt` (no fired protection waiting more than 5 s)
    # and `outbox_not_lagging`. The timeouts mirror the other workers': the health
    # server shares the loop, and a false "unhealthy" would restart a worker
    # mid-fill.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8001/ready', timeout=25); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 15s
      timeout: 30s
      start_period: 60s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
        # Dev-only placeholder (documented in .env.example) — real sign-in
        # needs actual Clerk dev keys in a repo-root `.env`; this only keeps
        # `next build` (and the container boot) from failing without one.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_Y2xlcmsuZXhhbXBsZS5jb20k}
    image: hunter-web:${GIT_SHA:-dev}
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      HUNTER_ENV: development
      # Same dev-only placeholder as the build arg above — auth will not
      # work until real keys arrive via `.env`.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_Y2xlcmsuZXhhbXBsZS5jb20k}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_FAKE_FOR_BUILD_ONLY}
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      - api
    # T3.28a — a fixed address so the api's INTERNAL_PEER_IPS (above) can
    # name it. The subnet below only exists to make this address stable
    # across restarts; every other container keeps Docker's normal dynamic
    # allocation (mirrors infra/vps/docker-compose.prod.yml's Caddy pin,
    # same reasoning: a fixed low address inside the allocator's own range
    # can be stolen by a container recreated without one, so the dynamic
    # range is restricted below to leave .1-.127 for pins like this).
    networks:
      default:
        ipv4_address: 172.29.0.10

volumes:
  hunter_pg:
  hunter_redis:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          ip_range: 172.29.0.128/25
