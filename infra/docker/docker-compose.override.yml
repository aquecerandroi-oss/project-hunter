# Local development override (auto-loaded by docker compose alongside docker-compose.yml).
#
# T1.6b proof, 2026-09-05 (.claude/state/t16b-proof.md) — measured against the real Binance:
#   * 1 process / 200 markets: the hot state COLLAPSED — ticker and book absent on all 200
#     within 15 min, CPU averaging 103.2% of a core, durable candles at 188/min against the
#     200/min the exchange closes.
#   * 2 shards x 100: CPU ~100% each, markets with all three components fresh oscillating ~26%.
#   * 4 shards x 50: markets_ok 198/200 = 99.0%, 200/200 candles per minute, steady-state CPU
#     averaging 36.6% / 54.6% / 61.2% / 64.2% of a core per shard. The plan's target, met.
#
# So 200 markets IS reachable — but not shipped as the default yet, and the reason is honest:
# with more than one shard every process writes the same `hb:market:{exchange}` heartbeat key,
# so /system/market-status reports ONE shard's subscriptions as the exchange total and a dead
# shard stays invisible behind the live ones that keep rewriting the key. M1 promises "página
# System com heartbeats reais"; a topology whose System page lies is not what gets shipped.
# Per-shard heartbeat + aggregation in the API is an M2 follow-up (obsidian/07-BUGS).
#
# Until then this machine runs ONE worker over the top 50 markets, which is the configuration
# where every M1 deliverable is true, measured below in §"1 processo x 50" of the proof.
# To run the proven 200-market topology anyway, see .claude/state/t16b-proof.md §7 — it is four
# services with MARKET_SHARD 0/4..3/4 and MARKET_UNIVERSE_SIZE 200.
services:
  market-worker:
    environment:
      MARKET_UNIVERSE_SIZE: "50"
      MARKET_SHARD: "0/1"
