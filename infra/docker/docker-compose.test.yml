# PROJECT HUNTER — ephemeral Postgres + Redis for local integration test runs
# that don't want to pay the testcontainers startup cost every time
# (docs/DEPLOYMENT.md §3). CI still uses testcontainers directly
# (tests/integration/conftest.py) — this is a local convenience only.
#
#   docker compose -f infra/docker/docker-compose.test.yml up -d
#   DATABASE_URL_MIGRATIONS=postgresql://hunter:hunter@localhost:55432/hunter \
#     uv run alembic -c infra/migrations/alembic.ini upgrade head
#   uv run pytest -m integration
#   docker compose -f infra/docker/docker-compose.test.yml down -v
#
# Non-standard host ports (55432/56379) so this can run alongside the dev
# stack's postgres/redis (5432/6379) without colliding.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: hunter
      POSTGRES_DB: hunter_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d hunter_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
