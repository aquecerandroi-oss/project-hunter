; PROJECT HUNTER — Alembic configuration.
;
; There is deliberately no sqlalchemy.url here: env.py reads
; DATABASE_URL_MIGRATIONS from hunter_core.settings.Settings, which is the
; direct (non-pooled) connection. Migrations must never run through the
; transaction pooler.
;
; Canonical command (CLAUDE.md):
;   uv run alembic -c infra/migrations/alembic.ini upgrade head

[alembic]
script_location = infra/migrations
prepend_sys_path = . infra/migrations
file_template = %%(rev)s_%%(slug)s
; both entries are relative to the repo root, which is the only place these
; commands are ever run from; "space" keeps the value readable on every OS.
path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
