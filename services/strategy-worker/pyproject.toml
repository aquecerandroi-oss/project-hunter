[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-strategy-worker"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  "hunter-indicators",
  "hunter-risk",
  "msgpack>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_strategy_worker"]
