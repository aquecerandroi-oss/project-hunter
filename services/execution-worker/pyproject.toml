[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-execution-worker"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  "hunter-risk",
  "hunter-exchanges",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_execution_worker"]
