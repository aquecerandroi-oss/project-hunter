[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-b3-robot"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hunter-core",
  "hunter-exchanges",
  "hunter-risk",
  # The official package ships win_amd64 wheels only and talks to a local
  # MetaTrader 5 terminal (docs/design/robo-b3-mt5.md §2). Linux CI never
  # installs it; the adapter imports it on demand, never at module import.
  "MetaTrader5==5.0.6231; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["hunter_b3_robot"]
