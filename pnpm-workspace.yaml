packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  unrs-resolver: true
# 24h supply-chain cooldown: a newly-published version isn't installable until it has existed this long.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@clerk/nextjs@7.9.1'
  - '@clerk/react@6.15.1'
  - lucide-react@1.41.0
virtualStoreDir: node_modules/.s
